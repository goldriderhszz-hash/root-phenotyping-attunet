name: Windows desktop release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test analysis pipeline
        run: python -m unittest discover -s tests -v
      - name: Build desktop application
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Python python
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootScope-Desktop-Windows-x64
          path: |
            release/RootScope-Desktop-Windows-x64-v1.1.0.zip
            release/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            release/RootScope-Desktop-Windows-x64-v1.1.0.zip `
            release/SHA256SUMS.txt `
            --title "RootScope Desktop $env:GITHUB_REF_NAME" `
            --notes "Native Windows desktop application and source release. See README.md and MODEL.md for usage and model provenance."
