name: Windows desktop release

on:
  push:
    branches: [main]
    tags: ["research-release"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test analysis pipeline
        run: python -m unittest discover -s tests -v
      - name: Build desktop application
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Python python
      - name: Verify packaged models
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "rootscope-self-test.json"
          & ./dist/RootScope/RootScope.exe --self-test $report
          $deadline = (Get-Date).AddSeconds(120)
          while (-not (Test-Path $report) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (-not (Test-Path $report)) {
            throw "Packaged RootScope self-test failed"
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne "ok" -or $result.models.Count -ne 5) {
            throw "The release must load all five ONNX models"
          }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootScope-Desktop-Windows-x64
          path: |
            release/RootScope-Desktop-Windows-x64.zip
            release/SHA256SUMS.txt
      - name: Publish tagged release
        if: github.ref == 'refs/tags/research-release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            release/RootScope-Desktop-Windows-x64.zip `
            release/SHA256SUMS.txt `
            --title "RootScope Research Release" `
            --notes "Native Windows desktop application and source release. See README.md and MODEL.md for usage and model provenance."
