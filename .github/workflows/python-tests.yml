name: Source tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Test five model artifacts and batch pipeline
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q rootscope scripts research analysis desktop.py cli.py
  numerical-records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Reproduce numerical records and geometry checks
        run: |
          python analysis/reproduce_tables.py --output analysis/generated
          python analysis/qa_analysis.py
          python analysis/audit_uncertainty.py
          python analysis/source_denominators.py
          python analysis/angle_geometry_audit.py
